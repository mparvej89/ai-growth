<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo">
      <ion-icon name="rocket-outline"></ion-icon>
      <h1>AI Growth Engine</h1>
    </div>

    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ isLogin ? 'Login' : 'Sign Up' }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Password" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input>
        </ion-item>

        <ion-button expand="block" class="ion-margin-top" (click)="submit()">
          {{ isLogin ? 'Login' : 'Sign Up' }}
        </ion-button>
        
        <ion-button fill="clear" expand="block" (click)="toggleMode()">
          {{ isLogin ? 'Need an account? Sign Up' : 'Already have an account? Login' }}
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
